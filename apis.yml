  description: >-
    Photon Unity Networking 2, the original high-level Unity multiplayer SDK layered over the Photon Realtime
    transport protocol (same binary messages, same UDP/TCP/WebSocket transports). Still supported for
    existing projects; Photon recommends Fusion or Quantum for new projects.
- aid: photonengine:photonengine-fusion-api
  name: Photon Fusion Networking API
  tags:
  - Fusion
  - Netcode
  - State Authoritative
  - Unity
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://doc.photonengine.com/fusion/current/getting-started/fusion-intro
  baseURL: wss://ns.exitgames.com:443
  properties:
  - url: https://doc.photonengine.com/fusion/current/getting-started/fusion-intro
    type: Documentation
  - url: https://doc-api.photonengine.com/en/fusion/current/
    type: APIReference
  description: >-
    Photon's current-generation, high-level networking framework for Unity, supporting Shared Mode, Client-Host,
    and dedicated Server Mode topologies with state-authoritative simulation. Runs its own tick/prediction
    layer on top of the Photon Realtime transport protocol; not a REST API.
- aid: photonengine:photonengine-quantum-api
  name: Photon Quantum Deterministic Simulation API
  tags:
  - Quantum
  - ECS
  - Deterministic
  - Lockstep
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://doc.photonengine.com/quantum/current/manual/introduction
  baseURL: wss://ns.exitgames.com:443
  properties:
  - url: https://doc.photonengine.com/quantum/current/manual/introduction
    type: Documentation
  - url: https://doc.photonengine.com/quantum/current/manual/webhooks
    type: Documentation
  description: >-
    Photon's deterministic, ECS-based simulation framework that ships player inputs (not state) across
    all clients in lockstep, re-simulating identically on every machine. Transport is the shared Photon
    Realtime protocol (UDP/TCP/WebSocket); Quantum also supports the same Room Lifecycle WebHooks as Realtime/Fusion.
- aid: photonengine:photonengine-voice-api
  name: Photon Voice API
  tags:
