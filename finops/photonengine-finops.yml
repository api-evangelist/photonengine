meters:
- name: peak_ccu
  description: Peak concurrent users observed against the provisioned CCU plan, per application/product.
  unit: concurrent_users
  aggregation: max
  dimensions:
  - application
  - product
  - region
- name: ccu_burst
  description: Temporary overage above the plan's CCU ceiling absorbed at no extra charge on 500+ CCU plans.
  unit: concurrent_users
  aggregation: max
  dimensions:
  - application
  - product
- name: bundled_traffic_gb
  description: Traffic allowance bundled into Growth-tier plans (for example ~1.5 TB at 500 CCU, ~6 TB at 2,000 CCU).
  unit: gigabytes
  aggregation: sum
  dimensions:
  - application
- name: premium_cloud_ccu_overage
  description: Per-CCU charge applied on Premium Cloud once a title scales past the top public-cloud tier.
  unit: concurrent_users
  aggregation: max
  dimensions:
  - application
principles:
- name: Visibility
  description: Monitor peak CCU per application in the Photon Dashboard; compare against the provisioned plan ceiling before it forces an upgrade or throttles new connections.
- name: Allocation
  description: Provision a separate Photon application (and CCU plan) per game/product/environment so spend maps cleanly to a team or title.
- name: Optimization
  description: Right-size the CCU tier to observed peaks rather than worst-case guesses; use the annual-commitment discount (two months free) once usage is stable; consolidate Voice/Chat onto the same title's traffic patterns when possible.
- name: Accountability
  description: Assign an owner per Photon application; review CCU headroom and Premium Cloud overage monthly, especially around launches and live events that spike concurrency.
