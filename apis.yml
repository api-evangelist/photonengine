apis:
- aid: photonengine:photonengine-realtime-transport-api
  name: Photon Realtime Transport Protocol
  tags:
  - Real-Time
  - Binary Protocol
  - UDP
  - TCP
  - WebSocket
  tags_raw:
  - Realtime
  - Binary Protocol
  - UDP
  - TCP
  - WebSocket
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://doc.photonengine.com/realtime/current/getting-started/realtime-intro
  baseURL: wss://ns.exitgames.com:443
  properties:
  - url: https://doc.photonengine.com/realtime/current/getting-started/realtime-intro
    type: Documentation
  - url: https://doc.photonengine.com/realtime/current/reference/binary-protocol
    type: APIReference
  - url: >-
      https://doc.photonengine.com/realtime/current/connection-and-authentication/secure-networks
    type: Documentation
  - url: asyncapi/photonengine-asyncapi.yml
    type: AsyncAPI
  description: >-
    The core Photon protocol - NOT a REST or JSON API. Clients connect through a Name Server to a Master
    Server (matchmaking/lobby) and then a Game Server (room gameplay), exchanging a proprietary binary
    message format (operation requests, operation responses, and events framed inside eNet-style commands)
    over UDP (reliable/unreliable), TCP, or WebSocket. WebSocket is a first-class documented transport
    - clients set ConnectionProtocol to WebSocket or WebSocketSecure and connect with ws:// on port 80
    or wss:// on port 443 (9090/19090 for self-hosted/Cloud Master listeners) - used primarily for WebGL
    and browser-hosted game clients.
- aid: photonengine:photonengine-pun-api
  name: Photon PUN (Photon Unity Networking) API
  tags:
  - PUN
  - Unity
  - Legacy
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://doc.photonengine.com/pun/current/getting-started/pun-intro
  baseURL: wss://ns.exitgames.com:443
  properties:
  - url: https://doc.photonengine.com/pun/current/getting-started/pun-intro
