aid: photonengine
url: https://raw.githubusercontent.com/api-evangelist/photonengine/refs/heads/main/apis.yml
name: Photon Engine
kind: company
description: >-
  Photon Engine (Exit Games) builds cross-platform multiplayer game
  networking backends - Photon Fusion, Photon Quantum, Photon Unity Networking
  (PUN), Photon Voice, Photon Chat, and the legacy Photon Bolt - all layered on
  the proprietary Photon Realtime transport protocol. Photon's core product is
  protocol-first and SDK-first, not REST-first - game clients exchange a
  custom binary message format (operation requests, operation responses, and
  events) with Name Server, Master Server, and Game Server roles, over UDP or
  TCP by default and, importantly, over WebSocket (ws:// unsecured, wss://
  secured on port 443) as a first-class documented transport for WebGL and
  browser-hosted clients. Photon's own hosted surface exposes no
  general-purpose callable REST API for gameplay; the only genuinely HTTP
  surfaces are outbound - Room Lifecycle WebHooks (Photon POSTs
  room/join/leave/event/property/close notifications to a developer-hosted
  URL) and the Custom Authentication webservice contract (Photon calls out to
  a developer-hosted HTTP(S) endpoint to validate client tokens before
  allowing a connection). Pricing and account management are handled through
  the Photon Cloud Dashboard web UI, not a documented public REST API.
