description: >-
  FinOps view of Photon spend. Unlike token- or request-metered APIs, Photon
  bills primarily against a provisioned Concurrent Users (CCU) capacity plan
  per application (Fusion, Quantum, Realtime, Voice, Chat each billed
  separately), with bundled traffic allowances at higher tiers and a per-CCU
  overage rate on Premium Cloud. There is no per-message or per-webhook-call
  charge documented for Room Lifecycle WebHooks or Custom Authentication -
  those ride on the same CCU-provisioned capacity.
notes: >-
  Because pricing is capacity-based (peak CCU) rather than usage-based (API
  calls/tokens), the primary FinOps lever is right-sizing the CCU plan to
  actual concurrent-player peaks, not reducing call volume.
